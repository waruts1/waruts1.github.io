name: Update contact form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply contact form improvements
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("index.html")
          s = p.read_text()

          s = s.replace('name="name" required placeholder="Your Name"', 'name="name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Your Name"', 1)
          s = s.replace('name="email" required placeholder="Your Email"', 'name="email" required maxlength="254" autocomplete="email" placeholder="Your Email"', 1)
          s = s.replace('name="message" required placeholder="Your Message"', 'name="message" required minlength="10" maxlength="2000" rows="5" placeholder="Your Message"', 1)

          old = '''        const payload = {
          name: String(formData.get("name") || "").trim(),
          email: String(formData.get("email") || "").trim(),
          message: String(formData.get("message") || "").trim()
        };
        formStatus.textContent = "Sending your message...";'''

          new = '''        const payload = {
          name: String(formData.get("name") || "").trim(),
          email: String(formData.get("email") || "").trim(),
          message: String(formData.get("message") || "").trim()
        };

        const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
        const honeypot = String(formData.get("_gotcha") || "").trim();

        if (honeypot) {
          formStatus.textContent = "Unable to send this message.";
          return;
        }

        if (!payload.name || !payload.email || !payload.message) {
          formStatus.textContent = "Please complete all fields before sending.";
          return;
        }

        if (payload.name.length < 2 || payload.name.length > 100) {
          formStatus.textContent = "Please enter a valid name.";
          return;
        }

        if (!emailPattern.test(payload.email) || payload.email.length > 254) {
          formStatus.textContent = "Please enter a valid email address.";
          return;
        }

        if (payload.message.length < 10 || payload.message.length > 2000) {
          formStatus.textContent = "Message must be between 10 and 2000 characters.";
          return;
        }

        formStatus.textContent = "Sending your message...";'''

          if old not in s:
              raise SystemExit("Contact submit block not found")
          s = s.replace(old, new, 1)

          old_success = 'formStatus.textContent = result.message || "Message sent successfully. Thank you for reaching out.";'
          new_success = 'formStatus.textContent = "Message sent successfully. Thank you for reaching out.";'
          if old_success not in s:
              raise SystemExit("Success message block not found")
          s = s.replace(old_success, new_success, 1)

          p.write_text(s)
          PY

      - name: Commit and remove temporary workflow
        run: |
          rm -f .github/workflows/update-contact-form.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-contact-form.yml
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen contact form validation"
          git push
