name: Update contact form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update contact form
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text = text.replace(
              '<input type="text" name="name" required placeholder="Your Name"',
              '<input type="text" name="name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Your Name"'
          )
          text = text.replace(
              '<input type="email" name="email" required placeholder="Your Email"',
              '<input type="email" name="email" required maxlength="254" autocomplete="email" placeholder="Your Email"'
          )
          text = text.replace(
              '<textarea name="message" required placeholder="Your Message"',
              '<textarea name="message" required minlength="10" maxlength="2000" rows="5" placeholder="Your Message"'
          )

          old = '''        const payload = {
          name: String(formData.get("name") || "").trim(),
          email: String(formData.get("email") || "").trim(),
          message: String(formData.get("message") || "").trim()
        };
        formStatus.textContent = "Sending your message...";'''

          new = '''        const payload = {
          name: String(formData.get("name") || "").trim(),
          email: String(formData.get("email") || "").trim(),
          message: String(formData.get("message") || "").trim()
        };

        const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;
        const honeypot = String(formData.get("_gotcha") || "").trim();

        if (honeypot) {
          formStatus.textContent = "Unable to send this message.";
          return;
        }

        if (!payload.name || !payload.email || !payload.message) {
          formStatus.textContent = "Please complete all fields before sending.";
          return;
        }

        if (payload.name.length < 2 || payload.name.length > 100) {
          formStatus.textContent = "Please enter a valid name.";
          return;
        }

        if (!emailPattern.test(payload.email) || payload.email.length > 254) {
          formStatus.textContent = "Please enter a valid email address.";
          return;
        }

        if (payload.message.length < 10 || payload.message.length > 2000) {
          formStatus.textContent = "Message must be between 10 and 2000 characters.";
          return;
        }

        formStatus.textContent = "Sending your message...";'''

          if old not in text:
              raise SystemExit('Contact submit block not found')
          text = text.replace(old, new, 1)

          old_success = '          formStatus.textContent = result.message || "Message sent successfully. Thank you for reaching out.";'
          new_success = '          formStatus.textContent = "Message sent successfully. Thank you for reaching out.";'
          if old_success not in text:
              raise SystemExit('Success message block not found')
          text = text.replace(old_success, new_success, 1)

          path.write_text(text, encoding='utf-8')
      - name: Remove temporary workflow
        run: rm -f .github/workflows/update-contact-form.yml
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-contact-form.yml
          git diff --cached --quiet && exit 0
          git commit -m "Strengthen contact form validation"
          git push
