name: Update contact form

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update contact form validation
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          original = text

          text, n1 = re.subn(
              r'name="name" required(?: minlength="2" maxlength="100" autocomplete="name")? placeholder="Your Name"',
              'name="name" required minlength="2" maxlength="100" autocomplete="name" placeholder="Your Name"',
              text, count=1)
          text, n2 = re.subn(
              r'name="email" required(?: maxlength="254" autocomplete="email")? placeholder="Your Email"',
              'name="email" required maxlength="254" autocomplete="email" placeholder="Your Email"',
              text, count=1)
          text, n3 = re.subn(
              r'name="message" required(?: minlength="10" maxlength="2000" rows="5")? placeholder="Your Message"',
              'name="message" required minlength="10" maxlength="2000" rows="5" placeholder="Your Message"',
              text, count=1)

          validation = '''\n        const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\n        const honeypot = String(formData.get("_gotcha") || "").trim();\n\n        if (honeypot) {\n          formStatus.textContent = "Unable to send this message.";\n          return;\n        }\n\n        if (!payload.name || !payload.email || !payload.message) {\n          formStatus.textContent = "Please complete all fields before sending.";\n          return;\n        }\n\n        if (payload.name.length < 2 || payload.name.length > 100) {\n          formStatus.textContent = "Please enter a valid name.";\n          return;\n        }\n\n        if (!emailPattern.test(payload.email) || payload.email.length > 254) {\n          formStatus.textContent = "Please enter a valid email address.";\n          return;\n        }\n\n        if (payload.message.length < 10 || payload.message.length > 2000) {\n          formStatus.textContent = "Message must be between 10 and 2000 characters.";\n          return;\n        }\n'''

          if 'const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;' not in text:
              marker = '        formStatus.textContent = "Sending your message...";'
              if marker not in text:
                  raise SystemExit('Could not locate contact form submit handler')
              text = text.replace(marker, validation + '\n' + marker, 1)

          text, success_count = re.subn(
              r'formStatus\.textContent\s*=\s*result\.message\s*\|\|\s*["\']Message sent successfully\. Thank you for reaching out\.["\'];',
              'formStatus.textContent = "Message sent successfully. Thank you for reaching out.";',
              text, count=1)

          if text == original:
              raise SystemExit('No changes were made; aborting rather than creating a no-op commit')
          if n1 + n2 + n3 == 0 and 'const emailPattern = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/' not in text and success_count == 0:
              raise SystemExit('Contact form markers were not found')

          path.write_text(text, encoding='utf-8')

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git commit -m "Strengthen contact form validation [skip ci]"
          git push
