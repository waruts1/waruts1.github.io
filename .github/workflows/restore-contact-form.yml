name: Restore portfolio contact form

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore contact form
        shell: python
        run: |
          from pathlib import Path
          import re

          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          # Restore the email link that was intentionally commented out.
          text = re.sub(
              r'\n        <!--\n(\s*<p class="mb-2 flex justify-center items-center gap-2">.*?</p>)\n        -->',
              r'\n        \1',
              text,
              count=1,
              flags=re.S,
          )

          # Restore the Contact Me trigger button.
          text = re.sub(
              r'\n        <!--\n(\s*<button id="openModal".*?</button>)\n        -->',
              r'\n        \1',
              text,
              count=1,
              flags=re.S,
          )

          # Restore the modal. The form is already wired to the live API endpoint
          # and the existing submit handler sends only name, email and message.
          text = re.sub(
              r'\n      <!--\n(\s*<div id="contactModal".*?</div>\n      </div>)\n      -->',
              r'\n\1',
              text,
              count=1,
              flags=re.S,
          )

          path.write_text(text, encoding="utf-8")

      - name: Remove temporary workflow
        run: rm -f .github/workflows/restore-contact-form.yml

      - name: Commit restored form
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/restore-contact-form.yml
          git diff --cached --quiet && exit 0
          git commit -m "Restore portfolio contact form"
          git push
