<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Analytics | Collins Warutumo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./config.js"></script>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 flex items-center justify-center p-6">
  <main class="text-center">
    <div class="mx-auto mb-5 flex h-16 w-16 items-center justify-center rounded-2xl border border-slate-800 bg-slate-900">
      <span class="text-2xl">↗</span>
    </div>
    <p class="text-xs font-bold uppercase tracking-[.28em] text-teal-400">Private console</p>
    <h1 class="mt-3 text-3xl font-bold">Portfolio Analytics</h1>
    <p id="status" class="mt-3 text-slate-400">Checking your session…</p>
    <noscript><p class="mt-4 text-red-300">JavaScript is required for the analytics console.</p></noscript>
  </main>
<script>
(function () {
  'use strict';
  const config = window.ANALYTICS_CONFIG;
  const status = document.getElementById('status');

  if (!config || !config.supabaseUrl || !config.supabaseAnonKey) {
    status.textContent = 'Analytics configuration is unavailable.';
    return;
  }

  const client = supabase.createClient(config.supabaseUrl, config.supabaseAnonKey);

  client.auth.getSession().then(function ({ data, error }) {
    if (error) {
      status.textContent = 'Unable to check the analytics session.';
      return;
    }
    location.replace(data.session ? './dashboard.html' : './login.html');
  });
})();
</script>
</body>
</html>
